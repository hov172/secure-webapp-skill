name: Validate skill

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@4f1f4aec02e41874fa0262ea8ff5172d7978ad1e
        with:
          persist-credentials: false
      - run: python3 -m py_compile scripts/refresh.py scripts/check_skill.py scripts/package_skill.py scripts/release_checksums.py scripts/eval_skill.py scripts/curate_references.py
      - run: rm -rf scripts/__pycache__
      - run: python3 scripts/refresh.py --dry-run --quiet
      - run: python3 scripts/package_skill.py
      - run: python3 scripts/check_skill.py
      # Detection-corpus coverage: every watchlist item must have a fixture.
      - run: python3 scripts/eval_skill.py --check
