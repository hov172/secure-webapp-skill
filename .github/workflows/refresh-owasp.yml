name: Refresh OWASP sources

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          persist-credentials: false
      - name: Refresh upstream OWASP material
        run: python3 scripts/refresh.py
      - name: Detect unresolved fetch errors
        id: fetch_errors
        run: |
          if grep -q "Fetch errors" _sources/CHANGES.md; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            {
              echo "detail<<SWEOF"
              sed -n '/Fetch errors/,/^## Changes by source/p' _sources/CHANGES.md | head -40
              echo "SWEOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      # Proposes reference edits from the actual upstream diff. Skips itself and
      # exits 0 when ANTHROPIC_API_KEY is unset, so the no-key refresh path is
      # unchanged. Whatever it writes still goes through review below.
      - name: Curate references from the upstream diff
        id: curate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CURATION_MODEL: ${{ vars.CURATION_MODEL }}
        run: python3 scripts/curate_references.py
      - name: Collect curation report for the PR body
        id: curation_report
        run: |
          if [ -f _sources/CURATION.md ]; then
            {
              echo "body<<SWEOF"
              cat _sources/CURATION.md
              echo "SWEOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "body=_No reference edits proposed this run._" >> "$GITHUB_OUTPUT"
          fi
      - name: Build package and checksums
        run: |
          python3 scripts/package_skill.py
          python3 scripts/release_checksums.py
      - name: Validate refreshed source tree
        run: |
          rm -rf scripts/__pycache__
          python3 scripts/check_skill.py
      # references/ may be edited by the curation step above, never by a blind
      # sync — and the result always goes to a human. This PR does not auto-merge.
      - name: Create refresh pull request
        id: cpr
        uses: peter-evans/create-pull-request@98357b18bf14b5342f975ff684046ec3b2a07725
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: refresh OWASP upstream source cache"
          title: "chore: refresh OWASP upstream sources"
          body: |
            Weekly automated refresh from upstream OWASP GitHub repositories.

            This PR includes:
            - refreshed `_sources/**` (see `_sources/CHANGES.md` for what moved upstream)
            - any reference edits proposed from those diffs
            - rebuilt `secure-webapp.skill`
            - refreshed `SHA256SUMS`

            ${{ steps.curation_report.outputs.body }}

            **Review required — this PR does not auto-merge.** Reference edits are
            model-proposed from the upstream diff and are not authoritative. Read
            them against `_sources/CHANGES.md` before merging, and re-run
            `python3 scripts/eval_skill.py --grade` if the guidance moved
            materially.
          branch: refresh/owasp-sources
          delete-branch: true
          add-paths: |
            _sources/**
            references/**
            secure-webapp.skill
            SHA256SUMS
      - name: Report unfetchable upstream files
        if: steps.fetch_errors.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "refresh: upstream OWASP file(s) could not be fetched"
          DETAIL: ${{ steps.fetch_errors.outputs.detail }}
        run: |
          existing=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          body=$(printf '%s\n\n%s\n\n%s\n' \
            "The weekly refresh could not fetch one or more files listed in \`scripts/manifest.json\`. Cached copies were kept, so the refresh itself still succeeded." \
            "$DETAIL" \
            "Usual cause: the file was renamed or removed upstream. Fix \`scripts/manifest.json\`.")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
