name: Release skill

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build skill package
        run: |
          python3 -m py_compile scripts/refresh.py scripts/check_skill.py scripts/package_skill.py scripts/release_checksums.py scripts/eval_skill.py scripts/curate_references.py
          python3 scripts/eval_skill.py --check
          rm -rf scripts/__pycache__ _sources
          python3 scripts/package_skill.py
          python3 scripts/release_checksums.py
          python3 scripts/check_skill.py
      - name: Upload release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          files: |
            secure-webapp.skill
            SHA256SUMS
